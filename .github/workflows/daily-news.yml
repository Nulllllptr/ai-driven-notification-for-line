name: Daily AI-Driven Development News
# Actionsへの再インデックスを促すための無害な更新

on:
  schedule:
    - cron: "55 0 * * *" # 【一時テスト用】scheduled workflowが実際に発火するか確認後、9:05 JSTへ戻す
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run orchestrator
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.orchestrator

      - name: Commit updated delivery state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/delivered.json; then
            echo "No state changes to commit"
          else
            git add data/delivered.json
            git commit -m "chore: update delivered articles state"
            git push
          fi
