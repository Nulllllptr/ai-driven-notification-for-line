name: Daily AI-Driven Development News

# 起動はGitHub Actionsのnative schedule(cron)ではなく、外部cronサービス(cron-job.org)から
# GitHub REST APIのworkflow dispatchエンドポイントを毎日9:05 JSTに叫く方式で行う。
# scheduleトリガーは検証の結果このリポジトリで機能しなかった(GitHub側の既知の信頼性問題、
# 同一症状の報告: https://github.com/orgs/community/discussions/202034 )ため、
# workflow_dispatchのみを残す(将来schedule側が復旧した場合の二重発火を避けるため)。
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run orchestrator
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.orchestrator

      - name: Commit updated delivery state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/delivered.json; then
            echo "No state changes to commit"
          else
            git add data/delivered.json
            git commit -m "chore: update delivered articles state"
            git push
          fi
